[pytest]
# Pytest configuration for EasyEDA2Xpedition tests

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum Python version
minversion = 6.0

# Add options for verbose output and coverage
addopts = 
    -v
    --strict-markers
    --tb=short

# Markers for test categorization
markers =
    unit: Unit tests for conversion functions
    integration: Integration tests
    slow: Tests that take a long time to run
    footprint: Footprint conversion tests
    symbol: Symbol conversion tests

# Coverage options (when using pytest-cov)
# Run with: pytest --cov=easyeda2xpedition tests/
